planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    action_server_result_timeout: 10.0
    costmap_update_timeout: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: robot/base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.30, 0.29], [0.30, -0.29], [-0.30, -0.29], [-0.30, 0.29]]"
      plugins: [static_layer, velodyne_obstacle_layer, hokuyo_obstacle_layer, inflation_layer]
      # Phase 1 leaves the filters parameter unset. A matching filter server and
      # an explicit derived params file are required before enabling keepout_filter.
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
      velodyne_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: velodyne_scan
        velodyne_scan:
          topic: /scan3
          data_type: LaserScan
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          obstacle_max_range: 15.0
          raytrace_max_range: 20.0
      hokuyo_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: hokuyo_scan
        hokuyo_scan:
          topic: /hokuyo_scan
          data_type: LaserScan
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          obstacle_max_range: 10.0
          raytrace_max_range: 15.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.70
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

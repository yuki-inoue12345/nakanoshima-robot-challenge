# EXAMPLE ONLY. Copy this file, replace every measured value, then change
# survey_confirmed to true. The tool refuses to use this unconfirmed template.
survey_confirmed: false
units: m
frame_id: base_footprint
checkerboard:
  inner_columns: 9
  inner_rows: 6
  square_size_m: 0.020

# These values describe measurement repeatability, not fitted camera noise.
survey_uncertainty:
  position_std_m: 0.003
  orientation_std_deg: 0.3
  random_seed: 920

# Used only for orange crosses in review images. It is never applied.
comparison_mount:
  camera_x: 0.20
  camera_y: 0.094
  camera_z: 0.6967
  camera_yaw_deg: 0.0
  camera_pitch_up_deg: 7.5
  camera_roll_deg: 0.0

# origin_base_m is the top-left INNER corner as seen from the robot/camera.
# For a vertical board facing the robot, image-right is base -y and image-down
# is base -z, hence the two constant axis vectors below. Example coordinates
# are deliberately non-authoritative and MUST be replaced by measurements.
placements:
  - id: near_center
    image: /replace/with/near_center.png
    origin_base_m: [1.20, 0.08, 0.75]
    column_axis_base: [0.0, -1.0, 0.0]
    row_axis_base: [0.0, 0.0, -1.0]
    corner_order: auto
  - id: mid_left
    image: /replace/with/mid_left.png
    origin_base_m: [1.55, 0.43, 0.75]
    column_axis_base: [0.0, -1.0, 0.0]
    row_axis_base: [0.0, 0.0, -1.0]
    corner_order: auto
  - id: mid_right
    image: /replace/with/mid_right.png
    origin_base_m: [1.75, -0.27, 0.75]
    column_axis_base: [0.0, -1.0, 0.0]
    row_axis_base: [0.0, 0.0, -1.0]
    corner_order: auto
  - id: far_center
    image: /replace/with/far_center.png
    origin_base_m: [2.05, 0.08, 0.78]
    column_axis_base: [0.0, -1.0, 0.0]
    row_axis_base: [0.0, 0.0, -1.0]
    corner_order: auto
